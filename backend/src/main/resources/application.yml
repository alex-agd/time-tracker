spring:
  application:
    name: time-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/timetracker}
    username: ${DB_USERNAME:timetracker}
    password: ${DB_PASSWORD:timetracker}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    # Позволяет убрать db/demo из locations после того, как демо-данные уже применены
    ignore-migration-patterns: "*:missing"
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
